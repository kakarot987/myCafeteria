spring.datasource.url=jdbc:h2:mem:cafeteriatest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
myCafeteria.app.jwtSecret=testing-only-signing-key-must-be-long-and-not-used-outside-tests-12345
myCafeteria.app.jwtExpirationMs=3600000
APP_BOOTSTRAP_ADMIN_USERNAME=
APP_BOOTSTRAP_ADMIN_PASSWORD=
