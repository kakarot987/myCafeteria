server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mycafeteria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${APP_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
myCafeteria.app.jwtSecret=${APP_JWT_SECRET}
myCafeteria.app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
