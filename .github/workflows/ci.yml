name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myCafeteriaD/myCafeteria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: myCafeteriaD/myCafeteria/pom.xml
      - name: Test backend
        run: mvn -B test
        env:
          APP_JWT_SECRET: ci-only-secret-signing-value-change-this-in-production-12345678901234567890
          SPRING_PROFILES_ACTIVE: test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myCafeteriaAngular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: npm
          cache-dependency-path: myCafeteriaAngular/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Angular UI
        run: npm run build
