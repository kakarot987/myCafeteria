name: Backend security regression tests
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myCafeteriaD/myCafeteria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: myCafeteriaD/myCafeteria/pom.xml
      - name: Compile and run signup role escalation regression
        run: mvn -B -ntp test -Dtest=AuthControllerSignupTests
