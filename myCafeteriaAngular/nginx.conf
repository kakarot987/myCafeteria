server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep Angular and the API on a single origin. Docker DNS resolves the
    # Spring Boot service by its Compose name, so localhost is never needed.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Swagger UI and the OpenAPI JSON are also served through the same origin.
    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
    location = /swagger-ui.html {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
    location /webjars/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
